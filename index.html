<!doctype html>
<html lang="" class="bg-b-l-d2 dark:bg-b-d-l8">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indriķis</title>
    <style>
      html {
        background: #f5f5f5;
      }
      html.dark {
        background: #1f1f1f;
      }
    </style>
    <script>
      ;(function () {
        const theme = localStorage.getItem('theme')
        if (
          theme === 'dark' ||
          (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app" class="w-screen h-screen flex items-center justify-center flex-col"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
